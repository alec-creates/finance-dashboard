name: Release production

# The only way to change the production database, and the only way to deploy the production app (ADR-0011,
# docs/deployment.md). Started by hand from the Actions tab, on main only. The "production" environment holds the
# secrets and requires the owner's approval before any job that uses them starts.
#
#   status:  read-only preflight (database identity, applied and pending migrations)
#   release: preflight -> prisma migrate deploy -> verify nothing is pending -> deploy this exact commit to Vercel
#
# The app is deployed with the pinned Vercel CLI from a clean checkout of this run's commit, so production runs exactly
# the reviewed code. Vercel builds it with the project's Production variables; no production variable is ever pulled
# into this runner. Git-triggered Vercel deployments are disabled (vercel.json).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status = read-only check; release = migrate, then deploy the app"
        type: choice
        options: [status, release]
        default: status
      confirm:
        description: 'For release, type "release production"'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.action }}
    # Never from another branch, even if someone starts it there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      # Not secret: the expected database's SHA-256 fingerprint (npm run db:fingerprint).
      PRODUCTION_DATABASE_FINGERPRINT: ${{ vars.PRODUCTION_DATABASE_FINGERPRINT }}
      DATABASE_ENV: production
    steps:
      - name: Require confirmation for a release
        if: inputs.action == 'release' && inputs.confirm != 'release production'
        run: |
          echo "Type 'release production' in the confirm field to run a release."
          exit 1

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Release only the latest main: an older commit must never migrate or replace newer code.
      - name: Check this commit is the head of main
        if: inputs.action == 'release'
        run: |
          head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved since this run started; start a new release from the latest main."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Dependencies' install scripts never run here, and no step before the database steps can see the secret.
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Generate the Prisma client (no database access)
        run: npx prisma generate

      - name: Preflight (read-only)
        run: npm run db:production:check
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: Apply migrations (prisma migrate deploy only)
        if: inputs.action == 'release'
        run: npm run db:production:migrate
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      - name: Verify nothing is pending (read-only)
        if: inputs.action == 'release'
        run: npm run db:production:verify-current
        env:
          DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}

      # Only this commit's tracked files: no node_modules, build output or generated client from the steps above.
      - name: Prepare a clean copy of this commit
        if: inputs.action == 'release'
        run: |
          git worktree add --detach "$RUNNER_TEMP/release" "$GITHUB_SHA"
          test "$(git -C "$RUNNER_TEMP/release" rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C "$RUNNER_TEMP/release" status --porcelain --ignored)"

      # Pinned CLI (reads VERCEL_TOKEN from the environment, so the token is never a command-line argument). Vercel builds
      # the uploaded commit with the project's Production variables, and the step waits for the result.
      - name: Deploy this commit to Vercel production
        if: inputs.action == 'release'
        working-directory: ${{ runner.temp }}/release
        run: npx --yes vercel@64.0.2 deploy --prod --yes --meta "githubCommitSha=$GITHUB_SHA"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: "1"
